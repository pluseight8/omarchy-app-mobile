name: Signed Android Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: Build, sign, and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify release source and owner signing secrets
        env:
          OMAAPP_KEYSTORE_BASE64: ${{ secrets.OMAAPP_KEYSTORE_BASE64 }}
          OMAAPP_KEY_ALIAS: ${{ secrets.OMAAPP_KEY_ALIAS }}
          OMAAPP_KEYSTORE_PASSWORD: ${{ secrets.OMAAPP_KEYSTORE_PASSWORD }}
          OMAAPP_KEY_PASSWORD: ${{ secrets.OMAAPP_KEY_PASSWORD }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            printf 'Release tags must point to a commit already reachable from main.\n' >&2
            exit 1
          fi
          if [[ -z "$OMAAPP_KEYSTORE_BASE64" || -z "$OMAAPP_KEY_ALIAS" || -z "$OMAAPP_KEYSTORE_PASSWORD" || -z "$OMAAPP_KEY_PASSWORD" ]]; then
            printf 'Configure OMAAPP_KEYSTORE_BASE64, OMAAPP_KEY_ALIAS, OMAAPP_KEYSTORE_PASSWORD, and OMAAPP_KEY_PASSWORD with the permanent owner keystore before tagging a release.\n' >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 emulator system-images;android-36;google_apis;x86_64

      - name: Set up Python for Qt installer
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Export Android toolchain paths
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Qt for Android
        # Keep the same pinned Qt installer path as CI.
        uses: jurplel/install-qt-action/action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: 6.10.3
          host: all_os
          target: android
          arch: android_arm64_v8a
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e
          cache: true

      - name: Build release APK
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[1-9][0-9]*$ ]]; then
            printf 'Expected a prerelease tag such as v0.1.0-alpha.1.\n' >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          numeric_version="${version%%-*}"
          expected_version_code="$(cmake \
            -DOMAAPP_VERSION_NAME="$version" \
            -DOMAAPP_VERSION="$numeric_version" \
            -P cmake/PrintAndroidVersionCode.cmake \
            | sed -n 's/.*OMAAPP_ANDROID_VERSION_CODE=//p')"
          test -n "$expected_version_code"
          echo "OMAAPP_EXPECTED_VERSION_CODE=$expected_version_code" >> "$GITHUB_ENV"
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build/android -GNinja -DCMAKE_BUILD_TYPE=Release -DOMAAPP_VERSION="$numeric_version" -DOMAAPP_VERSION_NAME="$version" -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          cmake --build build/android --target apk --parallel 2
          if [[ ! -d "$QT_ROOT_DIR/sbom" ]] || ! find "$QT_ROOT_DIR/sbom" -type f -print -quit | grep -q .; then
            printf 'Qt 6.10.3 Android arm64 SBOM is missing from the installed Qt target.\n' >&2
            exit 1
          fi
          tar -czf "$RUNNER_TEMP/OmaApp-Qt-6.10.3-android_arm64_v8a-SBOM.tar.gz" -C "$QT_ROOT_DIR" sbom

      - name: Sign and verify APK
        env:
          OMAAPP_KEYSTORE_BASE64: ${{ secrets.OMAAPP_KEYSTORE_BASE64 }}
          OMAAPP_KEY_ALIAS: ${{ secrets.OMAAPP_KEY_ALIAS }}
          OMAAPP_KEYSTORE_PASSWORD: ${{ secrets.OMAAPP_KEYSTORE_PASSWORD }}
          OMAAPP_KEY_PASSWORD: ${{ secrets.OMAAPP_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ -z "$OMAAPP_KEYSTORE_BASE64" || -z "$OMAAPP_KEY_ALIAS" || -z "$OMAAPP_KEYSTORE_PASSWORD" || -z "$OMAAPP_KEY_PASSWORD" ]]; then
            printf 'Release signing secrets are not configured; no APK will be published.\n' >&2
            exit 1
          fi
          apk_source="$(find build/android -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk_source" ]]; then
            printf 'Qt did not produce an APK.\n' >&2
            exit 1
          fi
          actual_version_code="$("$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$apk_source" \
            | sed -n "s/^package:.*versionCode='\([0-9][0-9]*\)'.*/\1/p" | head -n 1)"
          if [[ "$actual_version_code" != "$OMAAPP_EXPECTED_VERSION_CODE" ]]; then
            printf 'APK versionCode mismatch: expected %s, got %s.\n' \
              "$OMAAPP_EXPECTED_VERSION_CODE" "$actual_version_code" >&2
            exit 1
          fi
          mkdir -p dist
          unsigned_apk="dist/unsigned.apk"
          aligned_apk="dist/aligned.apk"
          signed_apk="dist/OmaApp-$RELEASE_TAG-arm64-v8a.apk"
          printf '%s' "$OMAAPP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/omaapp-release.jks"
          chmod 600 "$RUNNER_TEMP/omaapp-release.jks"
          cp "$apk_source" "$unsigned_apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -p -f 4 "$unsigned_apk" "$aligned_apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/omaapp-release.jks" \
            --ks-key-alias "$OMAAPP_KEY_ALIAS" \
            --ks-pass env:OMAAPP_KEYSTORE_PASSWORD \
            --key-pass env:OMAAPP_KEY_PASSWORD \
            --out "$signed_apk" "$aligned_apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$signed_apk" \
            | tee "$RUNNER_TEMP/omaapp-arm64-signature.txt"
          awk -F ': ' '/certificate SHA-256 digest:/ {print $2; exit}' \
            "$RUNNER_TEMP/omaapp-arm64-signature.txt" > "$RUNNER_TEMP/omaapp-signing-cert-sha256.txt"
          test -s "$RUNNER_TEMP/omaapp-signing-cert-sha256.txt"
          rm -f "$unsigned_apk" "$aligned_apk" "$RUNNER_TEMP/omaapp-release.jks"

      - name: Install Qt for Android x86_64 release verification
        uses: jurplel/install-qt-action/action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: 6.10.3
          host: all_os
          target: android
          arch: android_x86_64
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e
          cache: true

      - name: Build signed Android update test APKs
        env:
          OMAAPP_KEYSTORE_BASE64: ${{ secrets.OMAAPP_KEYSTORE_BASE64 }}
          OMAAPP_KEY_ALIAS: ${{ secrets.OMAAPP_KEY_ALIAS }}
          OMAAPP_KEYSTORE_PASSWORD: ${{ secrets.OMAAPP_KEYSTORE_PASSWORD }}
          OMAAPP_KEY_PASSWORD: ${{ secrets.OMAAPP_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          older_version="0.0.1"
          if [[ "$version" == "$older_version" ]]; then
            printf 'Release version must be newer than the update-test seed %s.\n' "$older_version" >&2
            exit 1
          fi
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build/android-upgrade-seed -GNinja -DCMAKE_BUILD_TYPE=Release -DOMAAPP_VERSION="$older_version" -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          cmake --build build/android-upgrade-seed --target apk --parallel 2
          numeric_version="${version%%-*}"
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build/android-release-x86_64 -GNinja -DCMAKE_BUILD_TYPE=Release -DOMAAPP_VERSION="$numeric_version" -DOMAAPP_VERSION_NAME="$version" -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          cmake --build build/android-release-x86_64 --target apk --parallel 2
          mkdir -p "$RUNNER_TEMP/omaapp-upgrade-test"
          seed_source="$(find build/android-upgrade-seed -type f -name '*.apk' -print -quit)"
          current_source="$(find build/android-release-x86_64 -type f -name '*.apk' -print -quit)"
          test -n "$seed_source"
          test -n "$current_source"
          printf '%s' "$OMAAPP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/omaapp-release.jks"
          chmod 600 "$RUNNER_TEMP/omaapp-release.jks"
          zipalign="$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign"
          apksigner="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          "$zipalign" -p -f 4 "$seed_source" "$RUNNER_TEMP/omaapp-upgrade-seed-aligned.apk"
          "$apksigner" sign --ks "$RUNNER_TEMP/omaapp-release.jks" --ks-key-alias "$OMAAPP_KEY_ALIAS" --ks-pass env:OMAAPP_KEYSTORE_PASSWORD --key-pass env:OMAAPP_KEY_PASSWORD --out "$RUNNER_TEMP/omaapp-upgrade-seed.apk" "$RUNNER_TEMP/omaapp-upgrade-seed-aligned.apk"
          "$zipalign" -p -f 4 "$current_source" "$RUNNER_TEMP/omaapp-release-x86-aligned.apk"
          "$apksigner" sign --ks "$RUNNER_TEMP/omaapp-release.jks" --ks-key-alias "$OMAAPP_KEY_ALIAS" --ks-pass env:OMAAPP_KEYSTORE_PASSWORD --key-pass env:OMAAPP_KEY_PASSWORD --out "$RUNNER_TEMP/omaapp-release-x86.apk" "$RUNNER_TEMP/omaapp-release-x86-aligned.apk"
          "$apksigner" verify --verbose --print-certs "$RUNNER_TEMP/omaapp-upgrade-seed.apk"
          "$apksigner" verify --verbose --print-certs "$RUNNER_TEMP/omaapp-release-x86.apk"
          rm -f "$RUNNER_TEMP/omaapp-release.jks" "$RUNNER_TEMP/omaapp-upgrade-seed-aligned.apk" "$RUNNER_TEMP/omaapp-release-x86-aligned.apk"

      - name: Install, launch, and update the signed release on Android
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        timeout-minutes: 20
        run: |
          apksigner="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          arm64_digest="$("$apksigner" verify --print-certs "dist/OmaApp-$RELEASE_TAG-arm64-v8a.apk" | awk -F ': ' '/certificate SHA-256 digest:/ {print $2; exit}')"
          x86_digest="$("$apksigner" verify --print-certs "$RUNNER_TEMP/omaapp-release-x86.apk" | awk -F ': ' '/certificate SHA-256 digest:/ {print $2; exit}')"
          test -n "$arm64_digest"
          test "$arm64_digest" = "$(cat "$RUNNER_TEMP/omaapp-signing-cert-sha256.txt")"
          test "$arm64_digest" = "$x86_digest"
          export ANDROID_USER_HOME="$RUNNER_TEMP/omaapp-release-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name omaapp-release-smoke --package 'system-images;android-36;google_apis;x86_64' --device pixel_2
          if [[ -e /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          emulator_args=(-avd omaapp-release-smoke -no-window -no-audio -no-boot-anim -gpu swangle -wipe-data)
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then emulator_args+=(-accel off); fi
          "$ANDROID_SDK_ROOT/emulator/emulator" "${emulator_args[@]}" &
          timeout 600s adb wait-for-device
          for attempt in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then break; fi
            sleep 5
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell wm size 412x892
          adb shell wm density 160
          adb install "$RUNNER_TEMP/omaapp-upgrade-seed.apk"
          adb shell cmd role add-role-holder --user 0 android.app.role.HOME app.omaapp
          adb shell am start -W -n app.omaapp/app.omaapp.OmaAppActivity
          sleep 8
          adb shell uiautomator dump --compressed /sdcard/omaapp-upgrade-seed.xml >/dev/null
          adb pull /sdcard/omaapp-upgrade-seed.xml "$RUNNER_TEMP/omaapp-upgrade-seed.xml" >/dev/null
          settings_target="$(python3 scripts/ci/android_accessibility_tap_target.py "$RUNNER_TEMP/omaapp-upgrade-seed.xml" 'Settings tab')"
          read -r settings_x settings_y <<< "$settings_target"
          adb shell input tap "$settings_x" "$settings_y"
          sleep 1
          adb shell uiautomator dump --compressed /sdcard/omaapp-upgrade-settings.xml >/dev/null
          adb pull /sdcard/omaapp-upgrade-settings.xml "$RUNNER_TEMP/omaapp-upgrade-settings.xml" >/dev/null
          grid_target="$(python3 scripts/ci/android_accessibility_tap_target.py "$RUNNER_TEMP/omaapp-upgrade-settings.xml" 'Use 5 app columns')"
          read -r grid_x grid_y <<< "$grid_target"
          adb shell input tap "$grid_x" "$grid_y"
          sleep 1
          adb install -r "$RUNNER_TEMP/omaapp-release-x86.apk"
          adb shell am start -W -n app.omaapp/app.omaapp.OmaAppActivity
          sleep 8
          adb shell uiautomator dump --compressed /sdcard/omaapp-after-upgrade-home.xml >/dev/null
          adb pull /sdcard/omaapp-after-upgrade-home.xml "$RUNNER_TEMP/omaapp-after-upgrade-home.xml" >/dev/null
          settings_target="$(python3 scripts/ci/android_accessibility_tap_target.py "$RUNNER_TEMP/omaapp-after-upgrade-home.xml" 'Settings tab')"
          read -r settings_x settings_y <<< "$settings_target"
          adb shell input tap "$settings_x" "$settings_y"
          sleep 1
          adb shell uiautomator dump --compressed /sdcard/omaapp-after-upgrade.xml >/dev/null
          adb pull /sdcard/omaapp-after-upgrade.xml "$RUNNER_TEMP/omaapp-after-upgrade.xml" >/dev/null
          python3 scripts/ci/android_accessibility_assert_checked.py "$RUNNER_TEMP/omaapp-after-upgrade.xml" 'Use 5 app columns'
          adb logcat -d -v threadtime -t 10000 > "$RUNNER_TEMP/omaapp-release-logcat.txt"
          if grep -E 'FATAL EXCEPTION|QQmlApplicationEngine failed to load component|module .* is not installed' "$RUNNER_TEMP/omaapp-release-logcat.txt"; then
            exit 1
          fi

      - name: Package plugin and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          plugin_archive="dist/OmaApp-Omarchy-Plugin-$RELEASE_TAG.tar.gz"
          tar -czf "$plugin_archive" --exclude='__pycache__' --exclude='*.py[cod]' -C omarchy-plugin .
          cp "$RUNNER_TEMP/OmaApp-Qt-6.10.3-android_arm64_v8a-SBOM.tar.gz" dist/
          cp "$RUNNER_TEMP/omaapp-signing-cert-sha256.txt" dist/SIGNING-CERT-SHA256.txt
          python3 - "$RUNNER_TEMP" "dist/OmaApp-$RELEASE_TAG-arm64-v8a.apk" <<'PY'
          import pathlib
          import sys
          import zipfile

          output = pathlib.Path(sys.argv[1]) / "OmaApp-APK-Native-Libraries.txt"
          apk = pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(apk) as archive:
              libraries = sorted(
                  name for name in archive.namelist()
                  if name.startswith("lib/arm64-v8a/") and name.endswith(".so")
              )
          if not libraries:
              raise SystemExit("APK contains no arm64 native libraries")
          output.write_text("\n".join(libraries) + "\n", encoding="utf-8")
          PY
          qt_source="dist/OmaApp-Qt-6.10.3-Source.tar.xz"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$qt_source" \
            https://download.qt.io/official_releases/qt/6.10/6.10.3/single/qt-everywhere-src-6.10.3.tar.xz
          echo 'cbc81e726b0ff3c0cdb0219bf74545e91cec013c4a8503c20f93f83d73dff5d2  '"$qt_source" \
            | sha256sum --check
          notice_stage="$RUNNER_TEMP/omaapp-open-source-notices"
          mkdir -p "$notice_stage/app/licenses"
          cp LICENSE THIRD_PARTY.md "$notice_stage/"
          cp app/licenses/NOTICE.md app/licenses/LGPL-3.0.txt app/licenses/Apache-2.0.txt \
            "$notice_stage/app/licenses/"
          cp app/android/kotlin/dev/omalauncher/widgets/lang/LICENSE-MIT \
            "$notice_stage/app/licenses/OWL-LICENSE-MIT.txt"
          cp "$RUNNER_TEMP/OmaApp-APK-Native-Libraries.txt" dist/
          cp dist/SIGNING-CERT-SHA256.txt "$notice_stage/"
          cp dist/OmaApp-APK-Native-Libraries.txt "$notice_stage/"
          notice_archive="dist/OmaApp-Open-Source-Notices-$RELEASE_TAG.tar.gz"
          tar -czf "$notice_archive" -C "$RUNNER_TEMP" omaapp-open-source-notices
          (
            cd dist
            sha256sum \
              "OmaApp-$RELEASE_TAG-arm64-v8a.apk" \
              "OmaApp-Omarchy-Plugin-$RELEASE_TAG.tar.gz" \
              OmaApp-Qt-6.10.3-Source.tar.xz \
              OmaApp-Qt-6.10.3-android_arm64_v8a-SBOM.tar.gz \
              "OmaApp-Open-Source-Notices-$RELEASE_TAG.tar.gz" \
              OmaApp-APK-Native-Libraries.txt \
              SIGNING-CERT-SHA256.txt > SHA256SUMS.txt
          )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/OmaApp-$RELEASE_TAG-arm64-v8a.apk" \
            "dist/OmaApp-Omarchy-Plugin-$RELEASE_TAG.tar.gz" \
            "dist/OmaApp-Qt-6.10.3-Source.tar.xz" \
            dist/OmaApp-Qt-6.10.3-android_arm64_v8a-SBOM.tar.gz \
            "dist/OmaApp-Open-Source-Notices-$RELEASE_TAG.tar.gz" \
            dist/OmaApp-APK-Native-Libraries.txt \
            dist/SIGNING-CERT-SHA256.txt \
            dist/SHA256SUMS.txt \
            --title "OmaApp $RELEASE_TAG" \
            --prerelease \
            --verify-tag \
            --generate-notes
