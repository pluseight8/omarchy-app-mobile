name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  desktop:
    name: Desktop build and checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python for Qt installer
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install Qt
        # Invoke the packaged Node action directly; the root wrapper's path check fails on SHA checkouts.
        uses: jurplel/install-qt-action/action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: 6.10.3
          host: linux
          target: desktop
          arch: linux_gcc_64
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e
          cache: true

      - name: Configure, build, and test
        run: |
          cmake -S . -B build/desktop -GNinja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/desktop --parallel 2
          ctest --test-dir build/desktop --output-on-failure

      - name: Lint QML
        run: |
          "$QT_ROOT_DIR/bin/qmllint" -I "$QT_ROOT_DIR/qml" -I build/desktop app/qml/Main.qml app/qml/Theme.qml app/qml/HyprlandSurface.qml app/qml/OwlWidgetView.qml app/qml/OwlNodeLoader.qml app/qml/OwlNode.qml

      - name: Validate Omarchy plugin manifest
        run: python3 scripts/validate_plugin_manifest.py omarchy-plugin

      - name: Test Omarchy plugin manifest validation
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Check shell scripts
        run: bash -n omarchy-plugin/install.sh omarchy-plugin/uninstall.sh

  android-arm64:
    name: Android arm64 build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018

      - name: Set up Python for Qt installer
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Export Android toolchain paths
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Qt for Android
        # Keep the same pinned Qt installer path as the desktop build.
        uses: jurplel/install-qt-action/action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: 6.10.3
          host: all_os
          target: android
          arch: android_arm64_v8a
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e
          cache: true

      - name: Build APK
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build/android -GNinja -DCMAKE_BUILD_TYPE=Debug -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          cmake --build build/android --target apk --parallel 2

      - name: Upload CI APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OmaApp-ci-debug-arm64
          path: build/android/**/*.apk
          if-no-files-found: error
          retention-days: 7

  android-emulator-smoke:
    name: Android x86_64 emulator smoke (${{ matrix.rhi_backend }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - rhi_backend: OpenGL
            gpu_mode: swangle
          - rhi_backend: Vulkan
            gpu_mode: swiftshader
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK and emulator image
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 emulator system-images;android-36;google_apis;x86_64

      - name: Set up Python for Qt installer
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Export Android toolchain paths
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Qt for Android x86_64
        uses: jurplel/install-qt-action/action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: 6.10.3
          host: all_os
          target: android
          arch: android_x86_64
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e
          cache: true

      - name: Build emulator APK
        run: |
          python3 scripts/ci/prepare_android_pairing_smoke.py
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build/android-emulator -GNinja -DCMAKE_BUILD_TYPE=Debug -DOMAAPP_TEST_RHI_BACKEND="${{ matrix.rhi_backend }}" -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          cmake --build build/android-emulator --target apk --parallel 2

      - name: Boot emulator, install OmaApp, and select it as HOME
        timeout-minutes: 20
        run: |
          export ANDROID_USER_HOME="$RUNNER_TEMP/omaapp-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          smoke_artifacts="$GITHUB_WORKSPACE/ci-artifacts/android-smoke"
          mkdir -p "$ANDROID_AVD_HOME" "$smoke_artifacts"
          trap 'status=$?; failed_command="$BASH_COMMAND"; trap - ERR; { printf "Android smoke failed at: %s (exit %s)\n" "$failed_command" "$status"; printf "ADB devices:\n"; adb devices -l; if [[ -n "${emulator_pid:-}" ]]; then printf "Emulator process:\n"; ps -p "$emulator_pid" -o pid=,stat=,args=; fi; printf "Emulator log tail:\n"; tail -n 80 "$smoke_artifacts/emulator.log"; } > "$smoke_artifacts/failure-diagnostics.txt" 2>&1 || true; timeout 10s adb logcat -d -v threadtime -t 1000 > "$smoke_artifacts/failure-logcat.txt" 2>&1 || true; cat "$smoke_artifacts/failure-diagnostics.txt" >&2; cat "$smoke_artifacts/failure-logcat.txt" >&2 2>/dev/null || true; exit "$status"' ERR
          printf 'no\n' | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name omaapp-smoke --package 'system-images;android-36;google_apis;x86_64' --device pixel_2
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" list avd | tee avds.txt
          grep -F 'Name: omaapp-smoke' avds.txt
          if [[ -e /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
          fi
          # Use ANGLE for the OpenGL RHI smoke and SwiftShader's Vulkan driver
          # for the Vulkan RHI smoke. Both modes are software-rendered.
          emulator_args=(-avd omaapp-smoke -no-window -no-audio -no-boot-anim -gpu "${{ matrix.gpu_mode }}" -wipe-data)
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo 'KVM is unavailable; using software CPU emulation.'
            emulator_args+=(-accel off)
          fi
          "$ANDROID_SDK_ROOT/emulator/emulator" "${emulator_args[@]}" > "$smoke_artifacts/emulator.log" 2>&1 &
          emulator_pid=$!
          cleanup_emulator() {
            if [[ -n "${emulator_pid:-}" ]]; then
              kill "$emulator_pid" 2>/dev/null || true
              wait "$emulator_pid" 2>/dev/null || true
            fi
          }
          trap cleanup_emulator EXIT
          timeout 600s adb wait-for-device
          for attempt in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              break
            fi
            sleep 5
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell wm size 412x892
          adb shell wm density 160
          apk="$(find build/android-emulator -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          adb install "$apk"
          adb logcat -c
          adb shell am start -W -n app.omaapp/app.omaapp.OmaAppActivity
          sleep 8
          # Keep startup diagnostics; the scenegraph assertion below verifies the actual RHI.
          adb logcat -d -v threadtime -t 10000 > "$smoke_artifacts/startup-logcat.txt"
          if grep -F 'Failed to build graphics pipeline state' "$smoke_artifacts/startup-logcat.txt"; then
            exit 1
          fi
          adb shell cmd role add-role-holder --user 0 android.app.role.HOME app.omaapp
          adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.HOME
          adb shell dumpsys role > role.txt
          adb shell dumpsys activity activities > activities.txt
          adb shell cmd package resolve-activity --brief --user 0 -a android.intent.action.MAIN -c android.intent.category.HOME > resolved-home.txt 2>&1 || true
          adb shell dumpsys window windows > windows.txt
          app_pid="$(adb shell pidof app.omaapp | tr -d '\r')"
          test -n "$app_pid"
          printf '%s\n' "$app_pid" > app-pid.txt
          cp role.txt activities.txt resolved-home.txt windows.txt app-pid.txt "$smoke_artifacts/"
          adb exec-out screencap -p > "$smoke_artifacts/launcher-before-pin.png"
          test -s "$smoke_artifacts/launcher-before-pin.png"
          adb shell uiautomator dump --compressed /sdcard/omaapp-before-pin.xml || true
          adb pull /sdcard/omaapp-before-pin.xml "$smoke_artifacts/window-before-pin.xml" || true
          visual_artifacts="$smoke_artifacts/visual"
          mkdir -p "$visual_artifacts"
          for screen in home apps devices style settings; do
            screen_label="${screen^}"
            python3 scripts/ci/android_accessibility_dump.py \
              "/sdcard/omaapp-visual-$screen.xml" "$visual_artifacts/$screen.xml"
            screen_target="$(python3 scripts/ci/android_accessibility_tap_target.py "$visual_artifacts/$screen.xml" "$screen_label")"
            read -r screen_x screen_y <<< "$screen_target"
            adb shell input tap "$screen_x" "$screen_y"
            sleep 1
            adb exec-out screencap -p > "$visual_artifacts/$screen.png"
            if [[ "$screen" == "apps" ]]; then
              bash scripts/ci/android_launcher_home_smoke.sh "$smoke_artifacts" "$app_pid"
              app_pid="$(adb shell pidof app.omaapp | tr -d '\r')"
              test -n "$app_pid"
              printf '%s\n' "$app_pid" > "$smoke_artifacts/app-pid-after-launcher-smoke.txt"
            fi
          done
          # Verify the live tab control can leave Settings; its earlier XML
          # snapshot is not valid once the taller Settings page is displayed.
          python3 scripts/ci/android_accessibility_dump.py \
            /sdcard/omaapp-settings-navigation.xml \
            "$smoke_artifacts/window-settings-navigation.xml"
          apps_target="$(python3 scripts/ci/android_accessibility_tap_target.py "$smoke_artifacts/window-settings-navigation.xml" 'Apps')"
          read -r apps_x apps_y <<< "$apps_target"
          adb shell input tap "$apps_x" "$apps_y"
          sleep 1
          python3 scripts/ci/android_accessibility_dump.py \
            /sdcard/omaapp-returned-to-apps.xml \
            "$smoke_artifacts/window-returned-to-apps.xml"
          python3 scripts/ci/android_accessibility_assert_checked.py \
            "$smoke_artifacts/window-returned-to-apps.xml" 'Apps'
          python3 scripts/ci/android_accessibility_tap_target.py \
            "$smoke_artifacts/window-returned-to-apps.xml" 'Create folder' >/dev/null
          adb exec-out screencap -p > "$smoke_artifacts/returned-to-apps.png"
          # Retain logs from after the style screen has exercised the surface shader.
          adb logcat -d -v threadtime --pid="$app_pid" -t 10000 > "$smoke_artifacts/renderer-logcat.txt"
          grep -F 'OmaApp initialized Qt Quick graphics API: ${{ matrix.rhi_backend }}' "$smoke_artifacts/renderer-logcat.txt"
          if grep -F 'Failed to build graphics pipeline state' "$smoke_artifacts/renderer-logcat.txt"; then
            exit 1
          fi
          baseline_dir=tests/visual_baselines/android
          if [[ "${{ matrix.rhi_backend }}" == "OpenGL" ]]; then
            baseline_dir="$baseline_dir/opengl"
          fi
          python3 scripts/ci/check_visual_regression.py "$visual_artifacts" \
            --baselines "$baseline_dir" --verify-style-surface
          sleep 8
          adb shell pidof app.omaapp
          final_pid="$(adb shell pidof app.omaapp | tr -d '\r')"
          adb logcat -d -v threadtime --pid="$final_pid" -t 10000 > "$smoke_artifacts/final-logcat.txt"
          grep -E 'OmaApp: enumerated [1-9][0-9]* launcher activities' "$smoke_artifacts/final-logcat.txt"
          if grep -E 'FATAL EXCEPTION|QQmlApplicationEngine failed to load component|module .* is not installed|ReferenceError:|Detected recursive rearrange|Failed to build graphics pipeline state' "$smoke_artifacts/final-logcat.txt"; then
            exit 1
          fi
          adb shell pm clear app.omaapp
          python3 scripts/ci/android_pairing_smoke.py
          python3 scripts/ci/check_visual_regression.py "$smoke_artifacts/paired-theme" \
            --baselines tests/visual_baselines/android-paired --screens style --allow-missing-baseline \
            --verify-style-surface --require-gradient --gradient-angle 37
          python3 scripts/ci/check_visual_regression.py "$smoke_artifacts/paired-theme/density-240" \
            --baselines tests/visual_baselines/android-paired --screens style \
            --expected-size 618 1338 --allow-missing-baseline --verify-style-surface \
            --require-gradient --gradient-angle 37
          trap - ERR

      - name: Upload Android smoke screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OmaApp-android-smoke-screenshots-${{ matrix.rhi_backend }}
          path: ${{ github.workspace }}/ci-artifacts/android-smoke/
          if-no-files-found: warn
          retention-days: 7
