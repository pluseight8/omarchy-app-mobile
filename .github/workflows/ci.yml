name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  desktop:
    name: Desktop build and checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python for Qt installer
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install Qt
        # Invoke the packaged Node action directly; the root wrapper's path check fails on SHA checkouts.
        uses: jurplel/install-qt-action/action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: 6.11.2
          host: linux
          target: desktop
          arch: gcc_64
          modules: qtquickcontrols2 qtshadertools
          cache: true

      - name: Configure, build, and test
        run: |
          cmake -S . -B build/desktop -GNinja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/desktop --parallel 2
          ctest --test-dir build/desktop --output-on-failure

      - name: Lint QML
        run: |
          "$QT_ROOT_DIR/bin/qmllint" -I "$QT_ROOT_DIR/qml" -I build/desktop app/qml/Main.qml app/qml/Theme.qml app/qml/HyprlandSurface.qml

      - name: Validate Omarchy plugin manifest
        run: python3 scripts/validate_plugin_manifest.py omarchy-plugin

      - name: Test Omarchy plugin manifest validation
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Check shell scripts
        run: bash -n omarchy-plugin/install.sh omarchy-plugin/uninstall.sh

  android-arm64:
    name: Android arm64 build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018

      - name: Set up Python for Qt installer
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Export Android toolchain paths
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Qt for Android
        # Keep the same pinned Qt installer path as the desktop build.
        uses: jurplel/install-qt-action/action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: 6.11.2
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: qtquickcontrols2 qtshadertools
          cache: true

      - name: Build APK
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build/android -GNinja -DCMAKE_BUILD_TYPE=Debug -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          cmake --build build/android --target apk --parallel 2

      - name: Upload CI APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OmaApp-ci-debug-arm64
          path: build/android/**/*.apk
          if-no-files-found: error
          retention-days: 7
