name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  desktop:
    name: Desktop build and checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python for Qt installer
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install Qt
        # Invoke the packaged Node action directly; the root wrapper's path check fails on SHA checkouts.
        uses: jurplel/install-qt-action/action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: 6.10.3
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtshadertools
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e
          cache: true

      - name: Configure, build, and test
        run: |
          cmake -S . -B build/desktop -GNinja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/desktop --parallel 2
          ctest --test-dir build/desktop --output-on-failure

      - name: Lint QML
        run: |
          "$QT_ROOT_DIR/bin/qmllint" -I "$QT_ROOT_DIR/qml" -I build/desktop app/qml/Main.qml app/qml/Theme.qml app/qml/HyprlandSurface.qml

      - name: Validate Omarchy plugin manifest
        run: python3 scripts/validate_plugin_manifest.py omarchy-plugin

      - name: Test Omarchy plugin manifest validation
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Check shell scripts
        run: bash -n omarchy-plugin/install.sh omarchy-plugin/uninstall.sh

  android-arm64:
    name: Android arm64 build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018

      - name: Set up Python for Qt installer
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Export Android toolchain paths
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Qt for Android
        # Keep the same pinned Qt installer path as the desktop build.
        uses: jurplel/install-qt-action/action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: 6.10.3
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: qtshadertools
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e
          cache: true

      - name: Build APK
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build/android -GNinja -DCMAKE_BUILD_TYPE=Debug -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          cmake --build build/android --target apk --parallel 2

      - name: Upload CI APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OmaApp-ci-debug-arm64
          path: build/android/**/*.apk
          if-no-files-found: error
          retention-days: 7

  android-emulator-smoke:
    name: Android x86_64 emulator smoke test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK and emulator image
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 emulator system-images;android-36;google_apis;x86_64

      - name: Set up Python for Qt installer
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Export Android toolchain paths
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Qt for Android x86_64
        uses: jurplel/install-qt-action/action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: 6.10.3
          host: all_os
          target: android
          arch: android_x86_64
          modules: qtshadertools
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e
          cache: true

      - name: Build emulator APK
        run: |
          python3 scripts/ci/prepare_android_pairing_smoke.py
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build/android-emulator -GNinja -DCMAKE_BUILD_TYPE=Debug -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          cmake --build build/android-emulator --target apk --parallel 2

      - name: Boot emulator, install OmaApp, and select it as HOME
        timeout-minutes: 20
        run: |
          export ANDROID_USER_HOME="$RUNNER_TEMP/omaapp-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name omaapp-smoke --package 'system-images;android-36;google_apis;x86_64' --device pixel_2
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" list avd | tee avds.txt
          grep -F 'Name: omaapp-smoke' avds.txt
          if [[ -e /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
          fi
          emulator_args=(-avd omaapp-smoke -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -wipe-data)
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo 'KVM is unavailable; using software CPU emulation.'
            emulator_args+=(-accel off)
          fi
          "$ANDROID_SDK_ROOT/emulator/emulator" "${emulator_args[@]}" &
          timeout 600s adb wait-for-device
          for attempt in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              break
            fi
            sleep 5
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell wm size 412x892
          adb shell wm density 160
          apk="$(find build/android-emulator -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          adb install "$apk"
          adb shell am start -W -n app.omaapp/org.qtproject.qt.android.bindings.QtActivity
          sleep 8
          adb shell cmd role add-role-holder --user 0 android.app.role.HOME app.omaapp
          adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.HOME
          adb shell dumpsys role > role.txt
          adb shell dumpsys activity activities > activities.txt
          grep -F 'app.omaapp' role.txt
          grep -F 'app.omaapp' activities.txt
          adb shell pidof app.omaapp
          smoke_artifacts="$GITHUB_WORKSPACE/ci-artifacts/android-smoke"
          mkdir -p "$smoke_artifacts"
          adb exec-out screencap -p > "$smoke_artifacts/launcher-before-pin.png"
          test -s "$smoke_artifacts/launcher-before-pin.png"
          adb shell uiautomator dump --compressed /sdcard/omaapp-before-pin.xml || true
          adb pull /sdcard/omaapp-before-pin.xml "$smoke_artifacts/window-before-pin.xml" || true
          pin_target="$(python3 scripts/ci/android_launcher_tap_target.py "$smoke_artifacts/window-before-pin.xml" || true)"
          printf '%s\n' "$pin_target" > "$smoke_artifacts/pin-target.txt"
          if [[ -n "$pin_target" ]]; then
            read -r pin_x pin_y <<< "$pin_target"
          else
            echo 'No accessible app button found; using the first grid-cell center for long press.'
            pin_x=58
            pin_y=410
          fi
          printf 'Long-pressing launcher app at %s,%s\n' "$pin_x" "$pin_y"
          adb shell input swipe "$pin_x" "$pin_y" "$pin_x" "$pin_y" 1200
          sleep 2
          adb exec-out screencap -p > "$smoke_artifacts/launcher-after-pin.png"
          adb logcat -d -t 5000 > pinned-logcat.txt
          grep -E 'OmaApp: pinned app count [1-9][0-9]*' pinned-logcat.txt
          adb shell am force-stop app.omaapp
          adb shell am start -W -n app.omaapp/org.qtproject.qt.android.bindings.QtActivity
          sleep 8
          adb logcat -d -t 10000 > restarted-logcat.txt
          grep -E 'OmaApp: loaded [1-9][0-9]* pinned apps' restarted-logcat.txt
          grep -E 'OmaApp: cached launcher icon for ' restarted-logcat.txt
          adb exec-out screencap -p > "$smoke_artifacts/launcher-before-tap.png"
          test -s "$smoke_artifacts/launcher-before-tap.png"
          adb shell uiautomator dump --compressed /sdcard/omaapp-after-restart.xml || true
          adb pull /sdcard/omaapp-after-restart.xml "$smoke_artifacts/window-after-restart.xml" || true
          tap_target="$(python3 scripts/ci/android_launcher_tap_target.py "$smoke_artifacts/window-after-restart.xml" || true)"
          printf '%s\n' "$tap_target" > "$smoke_artifacts/tap-target.txt"
          if [[ -n "$tap_target" ]]; then
            read -r tap_x tap_y <<< "$tap_target"
          else
            echo 'No accessible app button in the view hierarchy; using the first grid-cell center.'
            tap_x=58
            tap_y=500
          fi
          printf 'Tapping launcher app at %s,%s\n' "$tap_x" "$tap_y"
          adb shell input tap "$tap_x" "$tap_y"
          sleep 3
          adb logcat -d -t 5000 > "$smoke_artifacts/launch-logcat.txt"
          grep -E 'OmaApp: launch activity ' "$smoke_artifacts/launch-logcat.txt" || true
          adb shell screencap -p /sdcard/omaapp-after-tap.png
          adb pull /sdcard/omaapp-after-tap.png "$smoke_artifacts/launcher-after-tap.png"
          adb shell dumpsys activity activities > launched-app.txt
          resumed_activity="$(tr -d '\r' < launched-app.txt | grep -E 'mResumedActivity|topResumedActivity|^[[:space:]]*Resumed:' | head -n 1)"
          printf '%s\n' "$resumed_activity"
          printf '%s\n' "$resumed_activity" > "$smoke_artifacts/resumed-activity.txt"
          if [[ -z "$resumed_activity" || "$resumed_activity" == *app.omaapp* ]]; then
            printf 'Tapping the first launcher entry did not open another app.\n' >&2
            exit 1
          fi
          adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.HOME
          sleep 2
          adb shell pidof app.omaapp
          adb logcat -d -t 5000 > logcat.txt
          grep -E 'OmaApp: enumerated [1-9][0-9]* launcher activities' logcat.txt
          if grep -E 'FATAL EXCEPTION|QQmlApplicationEngine failed to load component' logcat.txt; then
            exit 1
          fi
          adb shell pm clear app.omaapp
          python3 scripts/ci/android_pairing_smoke.py

      - name: Upload Android smoke screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OmaApp-android-smoke-screenshots
          path: ${{ github.workspace }}/ci-artifacts/android-smoke/
          if-no-files-found: warn
          retention-days: 7
